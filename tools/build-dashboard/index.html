<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Nod build dashboard</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1b1e24;
    --border: #2a2e37;
    --text: #e6e8eb;
    --muted: #8a909c;
    --accent: #5b8cff;
    --ok: #4caf7d;
    --err: #e05a5a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    height: 100vh;
  }
  aside {
    width: 240px;
    flex-shrink: 0;
    border-right: 1px solid var(--border);
    padding: 16px;
    overflow-y: auto;
  }
  aside h1 {
    font-size: 14px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  aside p.sub {
    font-size: 11px;
    color: var(--muted);
    margin: 0 0 16px;
  }
  button.cmd {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 8px;
    font-size: 13px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  button.cmd:hover:not(:disabled) { border-color: var(--accent); }
  button.cmd:disabled { opacity: 0.5; cursor: default; }
  button.cmd .label { display: block; font-weight: 500; }
  button.cmd .cmdline {
    display: block;
    font-family: ui-monospace, "SF Mono", monospace;
    font-size: 10px;
    color: var(--muted);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
  }
  header .status { font-size: 12px; color: var(--muted); }
  header .status.running { color: var(--accent); }
  header .status.ok { color: var(--ok); }
  header .status.err { color: var(--err); }
  header button.clear {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 12px;
    cursor: pointer;
  }
  pre#output {
    flex: 1;
    margin: 0;
    padding: 16px;
    overflow-y: auto;
    font-family: ui-monospace, "SF Mono", monospace;
    font-size: 12px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }
  pre#output .cmdline-echo { color: var(--accent); }
  pre#output .exit-ok { color: var(--ok); }
  pre#output .exit-err { color: var(--err); }

  aside h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin: 20px 0 8px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  #deploy {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
  }
  #deploy label {
    display: block;
    font-size: 11px;
    color: var(--muted);
    margin: 8px 0 3px;
  }
  #deploy label:first-child { margin-top: 0; }
  #deploy select,
  #deploy input[type="text"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 12px;
  }
  #deploy .row {
    display: flex;
    gap: 8px;
  }
  #deploy .row > * { flex: 1; }
  #deploy .check {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text);
    margin: 6px 0 0;
  }
  #deploy .check input { margin: 0; }
  button#run-deploy {
    width: 100%;
    margin-top: 12px;
    padding: 9px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--accent);
    color: #0b0d10;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
  }
  button#run-deploy:disabled { opacity: 0.5; cursor: default; }
  button#run-deploy.live { background: var(--err); color: #fff; }
  p.hint {
    font-size: 10px;
    color: var(--muted);
    margin: 8px 0 0;
    line-height: 1.4;
  }
</style>
</head>
<body>
<aside>
  <h1>Nod build dashboard</h1>
  <p class="sub">runs against tools/build-dashboard/server.py</p>
  <div id="commands">loading commands…</div>

  <h2>Deploy</h2>
  <div id="deploy">
    <label for="d-version">Version</label>
    <select id="d-version-kind" onchange="toggleCustomVersion()">
      <option value="patch">patch</option>
      <option value="minor">minor</option>
      <option value="major">major</option>
      <option value="custom">custom (x.y.z)</option>
    </select>
    <input type="text" id="d-version-custom" placeholder="1.2.3" style="display:none; margin-top:6px;" />

    <label>Environment</label>
    <div class="row">
      <select id="d-env">
        <option value="0">Production</option>
        <option value="1">Sandbox (separate app, sandbox backend)</option>
      </select>
    </div>

    <label for="d-channel">Channel (optional)</label>
    <input type="text" id="d-channel" placeholder="beta" />

    <label for="d-feed">Feed (optional)</label>
    <input type="text" id="d-feed" placeholder="beta" />

    <label for="d-to">Enroll emails (optional, comma-separated)</label>
    <input type="text" id="d-to" placeholder="a@x.com,b@y.com" />

    <label class="check">
      <input type="checkbox" id="d-dryrun" checked onchange="updateDeployButton()" />
      Dry run (print plan, do nothing)
    </label>
    <label class="check">
      <input type="checkbox" id="d-skipnotarize" />
      Skip notarization
    </label>
    <label class="check">
      <input type="checkbox" id="d-nopublish" />
      No publish (build only, skip GitHub release + landing push)
    </label>

    <button id="run-deploy" onclick="runDeploy()">Run release (dry run)</button>
    <p class="hint">Wraps scripts/release.sh. With dry run off, this publishes a real GitHub release, notarizes with Apple, and pushes to hellonod.app — you'll get a confirm prompt first.</p>
  </div>
</aside>
<main>
  <header>
    <span id="status" class="status">idle</span>
    <button class="clear" onclick="clearOutput()">Clear</button>
  </header>
  <pre id="output"></pre>
</main>
<script>
  const output = document.getElementById("output");
  const status = document.getElementById("status");
  let running = false;
  let currentSource = null;

  function clearOutput() {
    output.textContent = "";
  }

  function setStatus(text, cls) {
    status.textContent = text;
    status.className = "status" + (cls ? " " + cls : "");
  }

  function appendLine(text, cls) {
    const span = document.createElement("div");
    if (cls) span.className = cls;
    span.textContent = text;
    output.appendChild(span);
    output.scrollTop = output.scrollHeight;
  }

  function setButtonsDisabled(disabled) {
    document.querySelectorAll("button.cmd").forEach((b) => (b.disabled = disabled));
    document.getElementById("run-deploy").disabled = disabled;
  }

  function run(id, label) {
    runUrl(`/api/run?cmd=${encodeURIComponent(id)}`, label);
  }

  function runUrl(url, label) {
    if (running) return;
    running = true;
    setButtonsDisabled(true);
    setStatus(`running: ${label}…`, "running");

    currentSource = new EventSource(url);
    currentSource.addEventListener("line", (e) => {
      const cls = e.data.startsWith("$ ") ? "cmdline-echo" : "";
      appendLine(e.data, cls);
    });
    currentSource.addEventListener("done", (e) => {
      const code = e.data;
      const ok = code === "0";
      appendLine(`\nexit ${code}`, ok ? "exit-ok" : "exit-err");
      setStatus(ok ? `${label} — done` : `${label} — failed (${code})`, ok ? "ok" : "err");
      currentSource.close();
      currentSource = null;
      running = false;
      setButtonsDisabled(false);
    });
    currentSource.onerror = () => {
      if (currentSource) currentSource.close();
      currentSource = null;
      if (running) {
        appendLine("\nconnection closed", "exit-err");
        setStatus("connection lost", "err");
        running = false;
        setButtonsDisabled(false);
      }
    };
  }

  function toggleCustomVersion() {
    const custom = document.getElementById("d-version-kind").value === "custom";
    document.getElementById("d-version-custom").style.display = custom ? "block" : "none";
  }

  function updateDeployButton() {
    const dryRun = document.getElementById("d-dryrun").checked;
    const btn = document.getElementById("run-deploy");
    btn.textContent = dryRun ? "Run release (dry run)" : "Run release — PUBLISH";
    btn.classList.toggle("live", !dryRun);
  }

  function runDeploy() {
    if (running) return;

    const kind = document.getElementById("d-version-kind").value;
    const version = kind === "custom" ? document.getElementById("d-version-custom").value.trim() : kind;
    if (!version) {
      alert("Enter a version.");
      return;
    }

    const dryRun = document.getElementById("d-dryrun").checked;
    if (!dryRun && !confirm("Dry run is OFF. This will publish a real release. Continue?")) {
      return;
    }

    const params = new URLSearchParams({
      version,
      sandbox: document.getElementById("d-env").value,
      channel: document.getElementById("d-channel").value.trim(),
      feed: document.getElementById("d-feed").value.trim(),
      to: document.getElementById("d-to").value.trim(),
      dryrun: dryRun ? "1" : "0",
      skipnotarize: document.getElementById("d-skipnotarize").checked ? "1" : "0",
      nopublish: document.getElementById("d-nopublish").checked ? "1" : "0",
    });

    runUrl(`/api/release?${params.toString()}`, `release ${version}`);
  }

  fetch("/api/commands")
    .then((r) => r.json())
    .then((commands) => {
      const container = document.getElementById("commands");
      container.textContent = "";
      commands.forEach((c) => {
        const btn = document.createElement("button");
        btn.className = "cmd";
        btn.onclick = () => run(c.id, c.label);
        const label = document.createElement("span");
        label.className = "label";
        label.textContent = c.label;
        const cmdline = document.createElement("span");
        cmdline.className = "cmdline";
        cmdline.textContent = c.cmd;
        btn.appendChild(label);
        btn.appendChild(cmdline);
        container.appendChild(btn);
      });
    })
    .catch(() => {
      document.getElementById("commands").textContent = "failed to load commands — is server.py running?";
    });
</script>
</body>
</html>
