name: Nod
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.0.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    from: 2.9.2
settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: targeted
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.example.nod
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: M44384588U
targets:
  Nod:
    type: application
    platform: macOS
    sources:
      - path: Nod
    dependencies:
      - sdk: IOKit.framework
      - package: Supabase
        product: Supabase
      - package: Sparkle
        product: Sparkle
      # Universal (arm64+x86_64) static VAD lib with onnxruntime bundled —
      # links into the app binary, so nothing extra to embed/sign.
      - framework: Vendor/sherpa-onnx.xcframework
        embed: false
    info:
      path: Nod/Info.plist
      # Versions MUST be listed here. xcodegen regenerates Info.plist from
      # this block on every run, and any field omitted here gets reset to
      # xcodegen's defaults (1.0 / 1) — silently downgrading the released
      # version and breaking Sparkle's appcast update flow. scripts/release.sh
      # bumps both this file and Info.plist (PlistBuddy) in lockstep.
      properties:
        CFBundleShortVersionString: "12.1.0"
        CFBundleVersion: "46"
        LSUIElement: true
        NSHumanReadableCopyright: ""
        NSMicrophoneUsageDescription: "Nod needs access to your microphone to capture meeting audio."
        NSScreenCaptureUsageDescription: "Nod needs screen recording permission to capture system audio during meetings."
        NSSpeechRecognitionUsageDescription: "Nod uses speech recognition to transcribe what is said during meetings."
        CFBundleURLTypes:
          - CFBundleURLName: com.example.nod.auth
            CFBundleURLSchemes:
              - nod
        SUFeedURL: "https://hellonod.app/appcast.xml"
        SUPublicEDKey: "/uu8USNElUMN+Bbw/SPdJywlJq2XfEVI/Rf+W7XzFBw="
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    settings:
      base:
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        CODE_SIGN_ENTITLEMENTS: Nod/Nod.entitlements
        ENABLE_DEBUG_DYLIB: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: Nod/Core/Audio/Nod-Bridging-Header.h
        # sherpa-onnx is C++; link libc++ (onnxruntime is bundled in the .a).
        OTHER_LDFLAGS: [-lc++]
      configs:
        Release:
          # Strip the symbol table from shipped binaries so `nm` reveals no
          # internal names. Postprocessing makes stripping run on plain Release
          # builds too, not only `xcodebuild archive`. Swift type metadata
          # (__swift5 sections) survives by design — the runtime needs it —
          # and SWIFT_REFLECTION_METADATA_LEVEL must stay at its default:
          # SwiftUI's @State re-rendering depends on reflection metadata.
          DEPLOYMENT_POSTPROCESSING: YES
          STRIP_INSTALLED_PRODUCT: YES
          STRIP_STYLE: all
          STRIP_SWIFT_SYMBOLS: YES
    preBuildScripts:
      - name: Check VAD xcframework
        basedOnDependencyAnalysis: false
        script: |
          if [ ! -d "$SRCROOT/Vendor/sherpa-onnx.xcframework" ]; then
            echo "error: Vendor/sherpa-onnx.xcframework is missing — run ./scripts/fetch-vad-xcframework.sh once, then build again." >&2
            exit 1
          fi
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        script: |
          export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
          if which swiftlint >/dev/null; then
            swiftlint lint --quiet
          else
            echo "warning: swiftlint not installed — run 'brew install swiftlint'"
          fi
  NodTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: NodTests
    dependencies:
      - target: Nod
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.nodTests
schemes:
  Nod:
    build:
      targets:
        Nod: all
        NodTests: [test]
    test:
      targets:
        - NodTests
    run:
      config: Debug
    archive:
      config: Release
