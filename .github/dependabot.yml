version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      all-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
      all-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    commit-message:
      prefix: "bump"
    open-pull-requests-limit: 5
