name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analytics-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test analytics edge functions
        run: |
          deno fmt --check \
            supabase/functions/_shared/connector-auth.ts \
            supabase/functions/_shared/connector-auth.test.ts \
            supabase/functions/_shared/dictation.test.ts \
            supabase/functions/_shared/speech.test.ts \
            supabase/functions/_shared/realtime.test.ts \
            supabase/functions/_shared/founder-mcp.ts \
            supabase/functions/_shared/founder-mcp.test.ts \
            supabase/functions/_shared/founder-mcp-server.test.ts \
            supabase/functions/founder-mcp/index.ts
          deno check supabase/functions/founder-mcp/index.ts
          deno test supabase/functions/sync-google-measurement/payload_test.ts
          deno test --allow-env --allow-net \
            supabase/functions/_shared/connector-auth.test.ts \
            supabase/functions/_shared/founder-mcp.test.ts \
            supabase/functions/_shared/founder-mcp-server.test.ts
      - name: Test integration adapters
        run: |
          deno test -A \
            supabase/functions/_shared/integrations/ \
            supabase/functions/integration-reconcile/
      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0
      - name: Start local Supabase
        run: supabase start
      - name: Test inference cost contracts
        run: |
          deno test --allow-env --allow-net \
            supabase/functions/_shared/model-policy.test.ts \
            supabase/functions/_shared/usage-context.test.ts \
            supabase/functions/_shared/inference-cost.test.ts
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres \
            -v ON_ERROR_STOP=1 -c 'create database nod_inference_upgrade'
          psql postgresql://postgres:postgres@127.0.0.1:54322/nod_inference_upgrade \
            -v ON_ERROR_STOP=1 -f supabase/tests/upgrade/inference_cost_upgrade.sql
      - name: Test analytics database contracts
        run: |
          for contract in supabase/tests/*.sql; do
            psql postgresql://postgres:postgres@127.0.0.1:54322/postgres \
              -v ON_ERROR_STOP=1 -f "$contract"
          done

  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      # xcodegen emits objectVersion 77, which only Xcode 16+ can read — pin the
      # newest stable Xcode so the runner's default (older) version doesn't fail
      # with "future Xcode project file format".
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache VAD xcframework
        uses: actions/cache@v6
        with:
          path: Vendor/sherpa-onnx.xcframework
          key: vad-${{ hashFiles('scripts/fetch-vad-xcframework.sh') }}

      - name: Fetch VAD xcframework
        run: ./scripts/fetch-vad-xcframework.sh

      - name: Install tooling
        run: brew install xcodegen

      # Pin SwiftFormat/SwiftLint to the versions developers run locally (and
      # that the pre-commit hook uses). Homebrew tracks latest, whose default
      # rule sets drift from local — e.g. a newer SwiftFormat turns on
      # `wrapIfStatementBodies` by default and then fails CI on files no local
      # run ever flags. The runner also PRE-installs newer builds at
      # /opt/homebrew/bin (which precedes /usr/local/bin on Apple Silicon), so we
      # drop the pinned binaries in their own dir and prepend it to PATH via
      # GITHUB_PATH to win over the pre-installed ones. Bump these in lockstep
      # with the team's local versions.
      - name: Install pinned lint tools
        env:
          SWIFTFORMAT_VERSION: 0.61.1
          SWIFTLINT_VERSION: 0.63.3
        run: |
          BIN="$RUNNER_TEMP/pinned-bin"
          mkdir -p "$BIN"
          curl -fsSL -o /tmp/swiftformat.zip \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip"
          unzip -o /tmp/swiftformat.zip -d "$BIN"
          curl -fsSL -o /tmp/swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          unzip -o /tmp/swiftlint.zip -d "$BIN"
          chmod +x "$BIN/swiftformat" "$BIN/swiftlint"
          echo "$BIN" >> "$GITHUB_PATH"
          "$BIN/swiftformat" --version
          "$BIN/swiftlint" version

      - name: Generate project
        run: xcodegen generate

      - name: SwiftFormat (lint)
        run: swiftformat --lint .

      - name: SwiftLint
        run: swiftlint lint --quiet

      - name: Build & test
        run: |
          xcodebuild \
            -project Nod.xcodeproj \
            -scheme Nod \
            -destination 'platform=macOS' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            test
